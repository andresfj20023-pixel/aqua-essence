name: Sincronización Automática Aqua Essence

on:
  schedule:
    # Se ejecuta cada 3 horas (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Permite ejecutar la sincronización manualmente desde GitHub con 1 clic

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar sincronización de precios (Disfragancias + Disperfumes)
        run: |
          python sync_originales.py

      - name: Confirmar y subir cambios al catálogo
        run: |
          git config user.name "Aqua Essence Bot"
          git config user.email "bot@aquaessence.co"
          git add catalogo-originales.js originales_data.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los precios ni en el catálogo."
          else
            git commit -m "chore: sincronización automática de catálogo y precios cada 3h [skip ci]"
            git push
          fi
